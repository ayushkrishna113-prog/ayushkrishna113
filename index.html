<head>
    <meta charset="UTF-8">

    <title>Car World - 100+ Cars</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f2f4f7;
            color: #222;
        }

        /* ================= HEADER ================= */

        header {
            background: #111;
            color: white;
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            font-size: 30px;
            letter-spacing: 2px;
        }

        header h1 span {
            color: #ff3b30;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        nav a:hover {
            color: #ff3b30;
        }

        /* ================= HERO ================= */

        .hero {
            min-height: 350px;
            background:
                linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
                url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1800&q=80");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 30px;
        }

        .hero-content h2 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero-content p {
            font-size: 19px;
            color: #ddd;
        }

        /* ================= CONTROLS ================= */

        .controls {
            width: 90%;
            max-width: 1300px;
            margin: 30px auto;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls input,
        .controls select {
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        .controls input {
            width: 350px;
        }

        /* ================= CAR COUNT ================= */

        .car-count {
            width: 90%;
            max-width: 1300px;
            margin: 0 auto 20px;
            font-size: 18px;
            font-weight: bold;
        }

        /* ================= CAR GRID ================= */

        .car-container {
            width: 90%;
            max-width: 1400px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;

            padding-bottom: 50px;
        }

        /* ================= CARD ================= */

        .car-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;

            box-shadow: 0 5px 20px rgba(0,0,0,.10);

            transition: .3s;

            display: flex;
            flex-direction: column;
        }

        .car-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,.18);
        }

        /* ================= IMAGE ================= */

        .image-container {
            width: 100%;
            height: 230px;
            background: #ddd;
            position: relative;
            overflow: hidden;
        }

        .car-image {
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition: transform .4s;
        }

        .car-card:hover .car-image {
            transform: scale(1.05);
        }

        .image-loading {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e9ecef;
            color: #555;
            font-size: 14px;
        }

        /* ================= CARD CONTENT ================= */

        .car-info {
            padding: 20px;
        }

        .brand {
            color: #ff3b30;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .car-info h3 {
            font-size: 24px;
            margin: 6px 0 15px;
        }

        .price {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .detail {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 7px;
        }

        .detail small {
            display: block;
            color: #777;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .detail strong {
            font-size: 13px;
        }

        .details-button {
            width: 100%;
            margin-top: 18px;

            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #111;
            color: white;

            cursor: pointer;
            font-size: 15px;
        }

        .details-button:hover {
            background: #ff3b30;
        }

        /* ================= MODAL ================= */

        .modal {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,.75);

            z-index: 2000;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 95%;
            max-width: 700px;

            border-radius: 15px;

            padding: 30px;

            max-height: 90vh;
            overflow-y: auto;

            position: relative;
        }

        .close {
            position: absolute;
            right: 20px;
            top: 15px;

            font-size: 30px;
            cursor: pointer;
        }

        .modal-image {
            width: 100%;
            height: 300px;

            object-fit: cover;

            border-radius: 10px;

            margin-bottom: 20px;
        }

        .modal-content h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .modal-content p {
            margin: 10px 0;
            font-size: 16px;
        }

        /* ================= NO RESULTS ================= */

        .no-results {
            grid-column: 1 / -1;

            text-align: center;

            padding: 60px;

            font-size: 22px;
            color: #777;
        }

        /* ================= FOOTER ================= */

        footer {
            background: #111;
            color: white;

            text-align: center;

            padding: 30px;

            margin-top: 30px;
        }

        footer span {
            color: #ff3b30;
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 7px;
            }

            .hero-content h2 {
                font-size: 35px;
            }

            .controls input {
                width: 100%;
            }

            .car-container {
                width: 94%;
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        },

        {
            brand: "Skoda",
            model: "Slavia",
            price: 1200000,
            engine: "1.5L Turbo",
            power: "150 HP",
            transmission: "7-Speed DSG",
            fuel: "Petrol"
        },

        {
            brand: "Skoda",
            model: "Kushaq",
            price: 1300000,
            engine: "1.5L Turbo",
            power: "150 HP",
            transmission: "7-Speed DSG",
            fuel: "Petrol"
        },

        {
            brand: "MG",
            model: "Hector",
            price: 1500000,
            engine: "1.5L Turbo",
            power: "143 HP",
            transmission: "CVT",
            fuel: "Petrol"
        },

        {
            brand: "MG",
            model: "Gloster",
            price: 3800000,
            engine: "2.0L Twin Turbo Diesel",
            power: "215 HP",
            transmission: "8-Speed Automatic",
            fuel: "Diesel"
        }

    ];


    /* =====================================================
       IMAGE SEARCH
       =====================================================

       This searches Wikimedia Commons using:

       Brand + Model + Car

       Example:

       BMW 3 Series car

       instead of simply:

       BMW

       This greatly improves model matching.
    */


    async function getCarImage(car) {

        const searchTerm =
            `${car.brand} ${car.model} car`;

        const apiURL =
            "https://commons.wikimedia.org/w/api.php?" +

            new URLSearchParams({

                action: "query",

                format: "json",

                origin: "*",

                generator: "search",

                gsrnamespace: "6",

                gsrsearch: searchTerm,

                gsrlimit: "5",

                prop: "imageinfo",

                iiprop: "url",

                iiurlwidth: "900"

            });


        try {

            const response = await fetch(apiURL);

            const data = await response.json();

            if (
                !data.query ||
                !data.query.pages
            ) {
                return null;
            }


            const pages =
                Object.values(data.query.pages);


            /*
             * Remove obvious non-car images.
             */

            const goodImages = pages.filter(page => {

                const title =
                    page.title.toLowerCase();

                return (

                    page.imageinfo &&

                    page.imageinfo[0] &&

                    page.imageinfo[0].thumburl &&

                    !title.includes("logo") &&

                    !title.includes("emblem") &&

                    !title.includes("badge") &&

                    !title.includes("icon")

                );

            });


            if (goodImages.length === 0) {
                return null;
            }


            /*
             * Use the first suitable image.
             */

            return goodImages[0]
                .imageinfo[0]
                .thumburl;


        } catch (error) {

            console.error(
                "Image loading error:",
                error
            );

            return null;
        }
    }


    /* =====================================================
       FORMAT PRICE
       ===================================================== */

    function formatPrice(price) {

        return new Intl.NumberFormat(
            "en-IN",
            {
                style: "currency",
                currency: "INR",
                maximumFractionDigits: 0
            }
        ).format(price);

    }


    /* =====================================================
       CREATE BRAND FILTER
       ===================================================== */

    function createBrandFilter() {

        const brands = [
            ...new Set(
                cars.map(car => car.brand)
            )
        ].sort();


        const filter =
            document.getElementById(
                "brandFilter"
            );


        brands.forEach(brand => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = brand;

            option.textContent = brand;

            filter.appendChild(option);

        });

    }


    /* =====================================================
       DISPLAY CARS
       ===================================================== */

    async function displayCars() {

        const container =
            document.getElementById(
                "carContainer"
            );


        const search =
            document.getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


        const brand =
            document.getElementById(
                "brandFilter"
            ).value;


        const sort =
            document.getElementById(
                "sort"
            ).value;


        let filteredCars =
            cars.filter(car => {

                const matchesSearch =

                    car.brand
                        .toLowerCase()
                        .includes(search)

                    ||

                    car.model
                        .toLowerCase()
                        .includes(search);


                const matchesBrand =

                    brand === "all"

                    ||

                    car.brand === brand;


                return (
                    matchesSearch &&
                    matchesBrand
                );

            });


        /* ================= SORT ================= */

        if (sort === "priceLow") {

            filteredCars.sort(
                (a, b) =>
                    a.price - b.price
            );

        }


        if (sort === "priceHigh") {

            filteredCars.sort(
                (a, b) =>
                    b.price - a.price
            );

        }


        if (sort === "name") {

            filteredCars.sort(
                (a, b) =>

                    `${a.brand} ${a.model}`
                        .localeCompare(
                            `${b.brand} ${b.model}`
                        )

            );

        }


        /* ================= COUNT ================= */

        document.getElementById(
            "carCount"
        ).textContent =

            `Showing ${filteredCars.length} car(s)`;


        /* ================= EMPTY ================= */

        if (filteredCars.length === 0) {

            container.innerHTML = `

                <div class="no-results">

                    No cars found.

                </div>

            `;

            return;

        }


        /* ================= CARDS ================= */

        container.innerHTML = "";


        filteredCars.forEach(
            (car, index) => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "car-card";


                /*
                 * Exact model name used
                 * for image search.
                 */

                const exactName =
                    `${car.brand} ${car.model}`;


                card.innerHTML = `

                    <div class="image-container">

                        <div
                            class="image-loading"
                            id="loading-${index}"
                        >
                            Loading ${exactName} image...
                        </div>

                        <img
                            class="car-image"
                            id="image-${index}"
                            alt="${exactName}"
                            style="display:none;"
                        >

                    </div>


                    <div class="car-info">

                        <div class="brand">
                            ${car.brand}
                        </div>

                        <h3>
                            ${car.model}
                        </h3>

                        <div class="price">
                            ${formatPrice(car.price)}
                        </div>


                        <div class="details">

                            <div class="detail">

                                <small>
                                    ENGINE
                                </small>

                                <strong>
                                    ${car.engine}
                                </strong>

                            </div>


                            <div class="detail">

                                <small>
                                    POWER
                                </small>

                                <strong>
                                    ${car.power}
                                </strong>

                            </div>


                            <div class="detail">

                                <small>
                                    TRANSMISSION
                                </small>

                                <strong>
                                    ${car.transmission}
                                </strong>

                            </div>


                            <div class="detail">

                                <small>
                                    FUEL
                                </small>

                                <strong>
                                    ${car.fuel}
                                </strong>

                            </div>

                        </div>


                        <button
                            class="details-button"
                            onclick='openModal(${JSON.stringify(car)})'
                        >
                            View Full Details
                        </button>

                    </div>

                `;


                container.appendChild(card);


                /*
                 * Load the exact car image.
                 */

                loadImage(
                    car,
                    index
                );

            }
        );

    }


    /* =====================================================
       LOAD IMAGE
       ===================================================== */

    async function loadImage(
        car,
        index
    ) {

        const image =
            document.getElementById(
                `image-${index}`
            );


        const loading =
            document.getElementById(
                `loading-${index}`
            );


        const imageURL =
            await getCarImage(car);


        if (imageURL) {

            image.src =
                imageURL;

            image.style.display =
                "block";

            loading.style.display =
                "none";

        } else {

            /*
             * If Wikimedia does not have
             * an exact image, display a
             * clear fallback instead of
             * showing a WRONG car.
             */

            loading.innerHTML = `

                <div style="
                    text-align:center;
                    padding:20px;
                ">

                    <strong>
                        ${car.brand} ${car.model}
                    </strong>

                    <br><br>

                    Image unavailable

                </div>

            `;

        }

    }


    /* =====================================================
       MODAL
       ===================================================== */

    async function openModal(car) {

        const modal =
            document.getElementById(
                "carModal"
            );


        const modalImage =
            document.getElementById(
                "modalImage"
            );


        document.getElementById(
            "modalTitle"
        ).textContent =

            `${car.brand} ${car.model}`;


        document.getElementById(
            "modalBrand"
        ).innerHTML =

            `<strong>Brand:</strong> ${car.brand}`;


        document.getElementById(
            "modalPrice"
        ).innerHTML =

            `<strong>Price:</strong> ${formatPrice(car.price)}`;


        document.getElementById(
            "modalEngine"
        ).innerHTML =

            `<strong>Engine:</strong> ${car.engine}`;


        document.getElementById(
            "modalPower"
        ).innerHTML =

            `<strong>Power:</strong> ${car.power}`;


        document.getElementById(
            "modalTransmission"
        ).innerHTML =

            `<strong>Transmission:</strong> ${car.transmission}`;


        document.getElementById(
            "modalFuel"
        ).innerHTML =

            `<strong>Fuel:</strong> ${car.fuel}`;


        modal.style.display =
            "flex";


        modalImage.style.display =
            "none";


        const imageURL =
            await getCarImage(car);


        if (imageURL) {

            modalImage.src =
                imageURL;

            modalImage.alt =
                `${car.brand} ${car.model}`;

            modalImage.style.display =
                "block";

        }

    }


    /* =====================================================
       CLOSE MODAL
       ===================================================== */

    function closeModal() {

        document.getElementById(
            "carModal"
        ).style.display = "none";

    }


    /* =====================================================
       CLOSE MODAL WHEN CLICKING OUTSIDE
       ===================================================== */

    window.addEventListener(
        "click",
        function(event) {

            const modal =
                document.getElementById(
                    "carModal"
                );


            if (event.target === modal) {

                closeModal();

            }

        }
    );


    /* =====================================================
       SEARCH EVENTS
       ===================================================== */

    document.getElementById(
        "search"
    ).addEventListener(
        "input",
        displayCars
    );


    document.getElementById(
        "brandFilter"
    ).addEventListener(
        "change",
        displayCars
    );


    document.getElementById(
        "sort"
    ).addEventListener(
        "change",
        displayCars
    );


    /* =====================================================
       START WEBSITE
       ===================================================== */

    createBrandFilter();

    displayCars();

</script>
